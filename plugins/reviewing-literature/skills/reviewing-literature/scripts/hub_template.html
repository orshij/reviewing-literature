.pfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px 22px}
.pf{min-width:0}
.pf.neg{background:var(--neg);border-radius:6px;padding:4px 6px}
.pf.wide{grid-column:1/-1}
.pf h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pf h4 .st{margin-left:0;text-transform:none;letter-spacing:0}
.pf p{margin:0;font-size:13px;max-width:75ch}
.pf.wide p{color:var(--muted);font-size:12px;max-width:none}
details.ev{margin:3px 0 0;font-size:12px}
details.ev summary{cursor:pointer;color:var(--muted)}
details.ev summary:hover{color:var(--accent)}
table.cmp td.cp{width:15em;min-width:12em}
table.cmp td.cp .t{display:block;font-weight:600}
table.cmp td.cv{min-width:28ch}
table.cmp td.cv>div{max-width:95ch}
table.cmp td.ce{width:16em;font-size:12px}
table.cmp th{cursor:default}
/* Details-group rows: each cell clamps to 3 lines; clicking the row unfolds it */
tr.cl{cursor:pointer}
tr.cl .clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
tr.cl.open .clamp{display:block;-webkit-line-clamp:unset;line-clamp:none;overflow:visible}
tr.cl.open>td:not(.neg){background:color-mix(in srgb,var(--accent) 5%,transparent)}
/* Presentation (step 8): chapter plan and narration script */
.pres-ch{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 14px;margin:12px 0}
.pres-ch h3{margin:0 0 4px;font-size:15px}
.pres-ch dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:8px 0}
.pres-ch dt{color:var(--muted)}
.pres-ch dd{margin:0}
.pres-scn td{vertical-align:top}
.pres-scn td.nar{min-width:320px;max-width:640px}
.pres-claim{font-size:11px;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pres-claim.illustrative{border-style:dashed}
/* Report tab: the ten sections of an applied-research review */
.rp-toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.rp-toc a{padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-decoration:none;color:var(--fg);font-size:13px}
.rp-s{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 16px;margin:12px 0}
.rp-s h3{margin:0 0 2px;font-size:16px}.rp-s h4{margin:14px 0 4px;font-size:14px}.rp-q{margin:0 0 10px;color:var(--muted)}
.rp-dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:8px 0}.rp-dl dt{color:var(--muted);font-weight:600}.rp-dl dd{margin:0}
.rp-dl dd ol{margin:0;padding-left:20px}
.rp-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.rp-cols ul{margin:4px 0;padding-left:18px}
.rp-l{margin:6px 0;padding-left:22px}.rp-l li{margin:0 0 6px}
.rp-refs a.id,.rp-refs .id{font-size:12px;margin-left:4px}
.tg{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;border:1px solid var(--muted);color:var(--muted);margin-right:6px;white-space:nowrap}
.tg.ok{border-color:var(--ok);color:var(--ok)}.tg.bad{border-color:var(--bad);color:var(--bad)}.tg.ac{border-color:var(--accent);color:var(--accent)}.tg.gk{border-style:dashed}
.rp-prop{border:2px dashed var(--c2);border-radius:8px;padding:8px 12px;margin:8px 0}
.rp-fam{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}.rp-fam:first-of-type{border-top:0}
.rp-s td{max-width:none}.rp-s .wrap{margin:6px 0}
.rp-miss{border-left:3px solid var(--warn);padding-left:8px}
</style>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('data').textContent);
// tables written as interned columns (results; papers and datasets that are not included; discovery_links as a list):
// rebuild them. String columns hold indexes into P.strings, author lists lists of indexes, repeated dicts an index into
// P.values (each row gets its own copy), other flat dicts [shape, values...] (litrev _pack_results; _unpack_packed in Python)
(function(){ var TB = DATA.tables || {}; Object.keys(TB).forEach(function(name){ var tb = TB[name], P = tb && tb.__packed__; if(!P) return;
  var sc = {}, lc = {}, vc = {}, ob = P.objs || {}; P.str_cols.forEach(function(c){ sc[c]=1; }); (P.strlist_cols || []).forEach(function(c){ lc[c]=1; });
  (P.val_cols || []).forEach(function(c){ vc[c]=1; });
  Object.keys(ob).forEach(function(c){ ob[c].sk = {}; ob[c].str_keys.forEach(function(f){ ob[c].sk[f]=1; }); });
  function dec(c, v){ if(sc[c]) return P.strings[v]; if(lc[c]) return v.map(function(j){ return P.strings[j]; });
    if(vc[c]) return JSON.parse(JSON.stringify(P.values[v]));
    if(!ob[c]) return v; var sh = ob[c].shapes[v[0]], d = {};
    for(var j=0;j<sh.length;j++){ var x = v[j+1]; d[sh[j]] = (x!==null && ob[c].sk[sh[j]]) ? P.strings[x] : x; } return d; }
  var out = P.list ? [] : {};
  if(!P.list) Object.keys(tb).forEach(function(k){ if(k!=='__packed__') out[k]=tb[k]; });
  P.rows.forEach(function(r){ var o = {}; for(var i=0;i<P.cols.length;i++){ var v=r[i]; if(v===null||v===undefined) continue; o[P.cols[i]] = dec(P.cols[i], v); } if(P.list) out.push(o); else out[o.id] = o; });
  TB[name] = out; }); })();
var T = DATA.tables, META = DATA.meta || {}, RANKS = DATA.ranks || {}, VAL = DATA.validation || {errors:[],warnings:[]};
var TRIM = DATA.hub_trim || null;
// the page size limit thins result rows off the KPI boards (litrev hub_results) and the records of papers and datasets
// that are not included (HUB_PAGE_TIERS); the data files keep every row and field
function trimNote(){ if(!TRIM) return ''; var gone=TRIM.rows_total-TRIM.rows_shown, parts=[];
  if(gone>0) parts.push(gone+' of '+TRIM.rows_total+' result rows are not shown ('+(TRIM.omitted_excluded_target||0)+' on datasets or metrics the review did not describe, '+(TRIM.omitted_baseline||0)+' that re-report another paper\'s baseline)');
  if(TRIM.quotes_trimmed) parts.push('rows off the KPI boards show no quote'+(TRIM.locations_cut?' and only the head of their location':''));
  if(TRIM.reasons_cut) parts.push(TRIM.reasons_cut+' papers and datasets that are not included show only the start of their status reason');
  if(TRIM.papers_slimmed) parts.push(TRIM.papers_slimmed+' papers that are not included show no link, authors, venue or citation count');
  return parts.length?'<p class="muted">To keep this page under the 16 MB limit, '+esc(parts.join('; '))+'. The files in data/ and rendered/csv/ keep every row and field.</p>':''; }
var RANK = DATA.ranking || {kpis:[],ranked:[],below_cut:[],unranked:[]}, FIGS = DATA.figures || {}, RTAB = DATA.result_tables || {}, SLIDE_GO = null;
var SECTIONS = [
  ['overview','Overview'],['explainers','Explainers'],['ranking','Ranking & clusters'],['coverage','Coverage'],['adjacent','Adjacent topics'],['decisions','Decisions'],['search_terms','Search terms'],['search_runs','Search runs'],['discovery_links','Discovery links'],
  ['papers','Papers'],['tasks','Tasks'],['datasets','Datasets'],['benchmarks','Benchmarks'],['metrics','Metrics'],['results','Results'],['details','Method details']
];
// Sidebar: these stay top level; everything else folds into the "Details" group.
var NAV_TOP = ['explainers','ranking','results','coverage','adjacent'], NAV_OPEN = null;
var PRES = DATA.presentation || null;      // step 8, only when the person opted in and a plan was merged
if(PRES&&PRES.plan){ SECTIONS.splice(5,0,['presentation','Presentation']); NAV_TOP.push('presentation'); }
// the Report tab: the ten sections of an applied-research review (step 7), first in the sidebar
var RSEC = (DATA.report_view||{}).sections || {};
if(DATA.report_view){ SECTIONS.splice(1,0,['report','Report']); NAV_TOP.unshift('report'); }
var NEG = {'not-found':1,'inaccessible':1,'not-reported':1,'not-applicable':1};
var DETAIL_FIELDS = [['data','Data'],['representation','Representation'],['loss','Loss'],['topology','Architecture'],['training_scheme','Training scheme'],['evidence_limitations','Evidence limitations']];
var DET={view:'cards',field:'loss',sort:'rank'};
try{var dv=JSON.parse(localStorage.getItem('hub-details')||'null'); if(dv){DET.view=dv.view||DET.view; DET.field=dv.field||DET.field; DET.sort=dv.sort||DET.sort;}}catch(x){}
function evFold(e){ if(!isEv(e)) return ''; var b=[];
  if(e.location) b.push('<span class="muted">@ '+esc(e.location)+'</span>');
  if(e.source){ b.push(/^https?:/.test(e.source)?'<a class="src" href="'+esc(e.source)+'" target="_blank" rel="noopener">source</a>':'<span class="src muted" title="'+esc(e.source)+'">cached text</span>'); }
  if(e.quote) b.push('<span class="quote">“'+esc(e.quote)+'”</span>');
  if(e.rationale) b.push('<span class="quote">'+esc(e.rationale)+'</span>');
  return b.length?'<details class="ev"><summary>evidence</summary>'+b.join(' ')+'</details>':''; }
function evBody(e){ return isEv(e)?(e.value==null?'<span class="muted">—</span>':fmtVal(e.value)):fmtVal(e); }
function evBadge(e){ return isEv(e)?'<span class="st '+esc(e.status)+'">'+esc(e.status)+'</span>':''; }
function paperHead(p){ var c=clusterOf(p.id);
  return idLink(p.id)+' <h3>'+(httpUrl(p.url)?'<a href="'+esc(httpUrl(p.url))+'" target="_blank" rel="noopener">'+esc(p.title||p.id)+'</a>':esc(p.title||p.id))+'</h3>'
    +'<span class="meta">'+esc([p.year,p.venue].filter(Boolean).join(' · '))+(c?' <span class="sw" style="background:'+famColor(c.id)+'"></span>'+esc(c.name||c.id):'')+'</span>'; }
function detailCard(p){
  return '<article class="pcard"><header>'+paperHead(p)+'</header><div class="pfields">'+DETAIL_FIELDS.map(function(f){ var e=p[f[0]], neg=isEv(e)&&NEG[e.status]===1;
    return '<section class="pf'+(f[0]==='evidence_limitations'?' wide':'')+(neg?' neg':'')+'"><h4>'+esc(f[1])+evBadge(e)+'</h4><p>'+evBody(e)+'</p>'+evFold(e)+'</section>'; }).join('')+'</div></article>'; }
function detailCompare(recs){ var f=DETAIL_FIELDS.filter(function(x){return x[0]===DET.field;})[0]||DETAIL_FIELDS[0];
  return '<div class="wrap"><table class="cmp"><thead><tr><th>Paper</th><th>'+esc(f[1])+'</th><th>Evidence</th></tr></thead><tbody>'+recs.map(function(p){ var e=p[f[0]], neg=isEv(e)&&NEG[e.status]===1;
    return '<tr class="cl" title="click to expand"><td class="cp">'+idLink(p.id)+'<span class="t">'+esc(shortTitle(p))+'</span><span class="muted">'+esc(p.year||'')+'</span></td><td class="cv'+(neg?' neg':'')+'"><div class="clamp">'+evBody(e)+'</div></td><td class="ce">'+evBadge(e)+evFold(e)+'</td></tr>'; }).join('')+'</tbody></table></div>'; }
// Details shows the top-N ranked papers once step 6 has run; before that, every included paper
function detailPapers(){ var top=(RANK.ranked||[]).map(function(r){return r.paper_id;});
  return top.length?top.map(function(id){return PP[id];}).filter(Boolean):rows('papers').filter(function(p){return p.status==='included';}); }
function detailsBody(all){ var q=state.q.toLowerCase(), recs=q?all.filter(function(r){return textOf(r).indexOf(q)>=0;}):all.slice();
  var pos={}; (RANK.ranked||[]).forEach(function(r){pos[r.paper_id]=r.position;});
  var key={rank:function(p){return pos[p.id]||1e9;},id:function(p){return p.id;},year:function(p){return -(p.year||0);},cluster:function(p){var c=clusterOf(p.id); return c?c.id:'~';}}[DET.sort]||function(p){return p.id;};
  recs.sort(function(a,b){var x=key(a),y=key(b); return x<y?-1:x>y?1:(a.id<b.id?-1:1);});
  return (DET.view==='compare'?detailCompare(recs):'<div class="pcards">'+recs.map(detailCard).join('')+'</div>')+'<p class="muted">'+recs.length+' papers</p>'; }
function detailsPage(main){ var all=detailPapers(), n=(RANK.ranked||[]).length;
  function save(){ try{localStorage.setItem('hub-details',JSON.stringify(DET));}catch(x){} }
  main.innerHTML='<h2>Details</h2><p class="muted">'+(n?'Top '+n+' papers from <a href="#ranking">Ranking &amp; clusters</a>; the full included set is in the Papers table.':'All included papers (no ranking yet).')+'</p><div class="tools"><input type="search" id="q" placeholder="filter papers…" value="'+esc(state.q)+'">'
    +'<span class="seg"><button data-v="cards"'+(DET.view==='cards'?' class="on"':'')+'>Cards</button><button data-v="compare"'+(DET.view==='compare'?' class="on"':'')+'>Compare one field</button></span>'
    +(DET.view==='compare'?'<label>Field <select id="dfield">'+DETAIL_FIELDS.map(function(f){return '<option value="'+f[0]+'"'+(f[0]===DET.field?' selected':'')+'>'+esc(f[1])+'</option>';}).join('')+'</select></label>':'')
    +'<label>Sort <select id="dsort">'+[['rank','rank'],['id','id'],['year','newest'],['cluster','cluster']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===DET.sort?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label></div><div id="dbody">'+detailsBody(all)+'</div>';
  var qi=document.getElementById('q'); qi.oninput=function(){state.q=qi.value; document.getElementById('dbody').innerHTML=detailsBody(all);};
  Array.prototype.forEach.call(main.querySelectorAll('.seg button'),function(b){b.onclick=function(){DET.view=b.getAttribute('data-v'); save(); detailsPage(main);};});
  var fs=document.getElementById('dfield'); if(fs) fs.onchange=function(){DET.field=fs.value; save(); document.getElementById('dbody').innerHTML=detailsBody(all);};
  document.getElementById('dsort').onchange=function(e){DET.sort=e.target.value; save(); document.getElementById('dbody').innerHTML=detailsBody(all);}; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// a link target from paper metadata: http(s) only, so a 'javascript:' URL in an outside record cannot run on a click
function httpUrl(u){ return /^https?:\/\//i.test(String(u==null?'':u))?String(u):''; }
function rows(name){var t=T[name]; if(!t) return []; return Array.isArray(t)?t:Object.keys(t).map(function(k){return t[k];});}
function isEv(v){return v&&typeof v==='object'&&!Array.isArray(v)&&('status' in v)&&('value' in v);}
function idLink(v){ if(typeof v==='string'&&/^[QSPTDBMRCX]\d{3,}$/.test(v)){var sec={Q:'search_terms',S:'search_runs',P:'papers',T:'tasks',D:'datasets',B:'benchmarks',M:'metrics',R:'results',C:'ranking',X:'explainers'}[v[0]];return '<a class="id" href="#'+sec+'?q='+encodeURIComponent(v)+'">'+esc(v)+'</a>';} return null;}
function fmtVal(v){
  if(v==null) return '<span class="muted">—</span>';
  var l=idLink(v); if(l) return l;
  if(Array.isArray(v)) return v.map(fmtVal).join('; ');
  if(typeof v==='object'){ return Object.keys(v).filter(function(k){return v[k]!=null&&v[k]!==''&&!(Array.isArray(v[k])&&!v[k].length);}).map(function(k){return '<span class="muted">'+esc(k)+'=</span>'+fmtVal(v[k]);}).join(' '); }
  if(typeof v==='string'&&/^https?:\/\//.test(v)) return '<a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(v.replace(/^https?:\/\//,'').slice(0,60))+'</a>';
  return esc(v);
}
function fmtEv(e){
  var h=fmtVal(e.value)+'<span class="st '+esc(e.status)+'">'+esc(e.status)+'</span>';
  if(e.source){ if(/^https?:/.test(e.source)) h+='<a class="src" href="'+esc(e.source)+'" target="_blank" rel="noopener">source</a>'; else h+='<span class="src muted" title="'+esc(e.source)+'">cached text</span>'; }
  if(e.location) h+='<span class="muted"> @ '+esc(e.location)+'</span>';
  if(e.quote) h+='<span class="quote">“'+esc(e.quote)+'”</span>';
  if(e.rationale) h+='<span class="quote">'+esc(e.rationale)+'</span>';
  return h;
}
function cell(v){ if(isEv(v)) return {h:fmtEv(v),neg:NEG[v.status]===1}; return {h:fmtVal(v),neg:false}; }
function sortKey(v){ if(isEv(v)) v=v.value; if(v==null) return ''; if(typeof v==='number') return v; return String(Array.isArray(v)?v.join(' '):typeof v==='object'?JSON.stringify(v):v).toLowerCase(); }
function textOf(r){ return JSON.stringify(r).toLowerCase(); }
var state={sort:{},q:''};
function table(name, recs, cols){
  var q=state.q.toLowerCase(); if(q) recs=recs.filter(function(r){return textOf(r).indexOf(q)>=0;});
  var s=state.sort[name]; if(s){ recs=recs.slice().sort(function(a,b){var x=sortKey(a[s.col]),y=sortKey(b[s.col]); if(x<y) return s.dir; if(x>y) return -s.dir; return 0;}); }
  var h='<div class="wrap"><table><thead><tr>'+cols.map(function(c){var d=s&&s.col===c?(s.dir>0?' <span class="dir">▲</span>':' <span class="dir">▼</span>'):'';return '<th data-col="'+esc(c)+'">'+esc(c)+d+'</th>';}).join('')+'</tr></thead><tbody>';
  recs.forEach(function(r){ h+='<tr class="cl" title="click to expand">'+cols.map(function(c){var x=cell(r[c]); return '<td'+(x.neg?' class="neg"':'')+'><div class="clamp">'+x.h+'</div></td>';}).join('')+'</tr>'; });
  h+='</tbody></table></div><p class="muted">'+recs.length+' rows</p>'; return h;
}
function colsOf(recs){ var c=[]; recs.forEach(function(r){Object.keys(r).forEach(function(k){if(c.indexOf(k)<0)c.push(k);});}); return c; }
function overview(){
  var P=rows('papers'), inc=P.filter(function(p){return p.status==='included';}), exc=P.filter(function(p){return p.status==='excluded';});
  var hist={}; ['papers','datasets','tasks','metrics','benchmarks'].forEach(function(t){rows(t).forEach(function(r){Object.keys(r).forEach(function(k){if(isEv(r[k])) hist[r[k].status]=(hist[r[k].status]||0)+1;});});});
  rows('results').forEach(function(r){hist[r.status]=(hist[r.status]||0)+1;});
  var h='<h2>'+esc(META.slug||'review')+'</h2><p>'+esc(META.purpose||'')+'<br><span class="muted">seed: '+esc(META.seed||'')+' · rendered '+esc(DATA.rendered_at||'')+' · caps: '+esc(JSON.stringify(META.caps||{}))+'</span></p>';
  h+='<div class="cards">'+[['Included papers',inc.length],['Excluded',exc.length],['Candidates',P.length-inc.length-exc.length],['Search runs',rows('search_runs').length],['Tasks',rows('tasks').length],['Datasets',rows('datasets').length],['Benchmarks',rows('benchmarks').length],['Metrics',rows('metrics').length],['Results',(TRIM&&TRIM.rows_total)||rows('results').length]].map(function(x){return '<div class="card"><b>'+x[1]+'</b><span>'+esc(x[0])+'</span></div>';}).join('')+'</div>';
  h+=trimNote();
  h+=bibLink();
  if(META.scope) h+='<p><b>Scope.</b> In: '+esc((META.scope['in']||[]).join('; '))+(META.scope.out&&META.scope.out.length?' &middot; Out: '+esc(META.scope.out.join('; ')):'')+' <a href="#decisions">Decisions</a>'+(ADJ?' &middot; <a href="#adjacent">Adjacent topics</a>':'')+'</p>';
  h+='<h3>Evidence status histogram</h3><p>'+Object.keys(hist).sort().map(function(k){return '<span class="st '+esc(k)+'">'+esc(k)+' '+hist[k]+'</span>';}).join(' ')+'</p>';
  h+='<h3>Validation</h3><p>'+VAL.errors.length+' errors, '+VAL.warnings.length+' warnings</p>';
  if(VAL.errors.length) h+='<details><summary>Errors</summary><pre>'+esc(VAL.errors.join('\n'))+'</pre></details>';
  if(VAL.warnings.length) h+='<details><summary>Warnings</summary><pre>'+esc(VAL.warnings.join('\n'))+'</pre></details>';
  h+='<h3>Included papers</h3><ul>'+inc.sort(function(a,b){return (b.year||0)-(a.year||0);}).map(function(p){return '<li>'+idLink(p.id)+' ('+esc(p.year)+') '+pLink(p.id,p.title)+' <span class="muted">— '+esc(p.status_reason||'')+'</span></li>';}).join('')+'</ul>';
  return h;
}

var DSN={}, MT={}, PP={};
rows('datasets').forEach(function(d){DSN[d.id]=d.name;}); rows('benchmarks').forEach(function(b){DSN[b.id]=b.name;});
rows('metrics').forEach(function(m){MT[m.id]=m;}); rows('papers').forEach(function(p){PP[p.id]=p;});
var LB={metric:null,best:true,baselines:false,raw:false,ds:'',split:'',singles:false,at:0};
try{var lbs=JSON.parse(localStorage.getItem('hub-lb')||'null'); if(lbs){LB.best=lbs.best!==false; LB.baselines=!!lbs.baselines; LB.metric=lbs.metric||null; LB.ds=lbs.ds||''; LB.split=lbs.split||''; LB.singles=!!lbs.singles;}}catch(x){}
function saveLB(){try{localStorage.setItem('hub-lb',JSON.stringify({best:LB.best,baselines:LB.baselines,metric:LB.metric,ds:LB.ds,split:LB.split,singles:LB.singles}));}catch(x){}}
function shortTitle(p){ if(!p) return ''; var t=String(p.title||p.id), i=t.indexOf(':'); if(i>1&&i<42) return t.slice(0,i); return t.length>52?t.slice(0,50)+'…':t; }
function availOf(ev){ var v=ev&&ev.value; return (v&&v.availability)||'unknown'; }
function normSplit(s){ var x=String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim(); if(!x) return 'split not stated'; if(/same/.test(x)&&!/cross/.test(x)) return 'same-area'; if(/cross|different area|unseen area/.test(x)&&!/same/.test(x)) return 'cross-area'; return x; }

  var tk=(sm.tasks||{}).rows||[], F=RVW.families||[], FC=RVW.facets||[];
  h+=sec(4, '<h4>Tasks</h4>'+(tk.length?repTable(['Task','What it is','Main test sets','Papers'], tk.map(function(r){ return '<tr><td>'+(idLink(r.id)||'')+' '+esc(r.name)+'</td><td>'+esc(r.definition||'')+'</td><td>'+esc((r.test_sets||[]).join(', '))+'</td><td>'+esc(r.papers)+'</td></tr>'; })):'<p class="muted">No tasks with included papers.</p>')
    +'<h4>Method families</h4>'+(F.length?repTable(['Family','What it does'].concat(FC.map(function(f){return esc(f.charAt(0).toUpperCase()+f.slice(1));})).concat(['Papers','Best paper']), F.map(function(f){ return '<tr><td>'+(idLink(f.id)||'')+' '+esc(f.name)+'</td><td>'+esc(f.definition||'')+'</td>'+FC.map(function(k){return '<td>'+esc((f.facets||{})[k]||'')+'</td>';}).join('')+'<td>'+esc(f.members)+'</td><td>'+(f.winner?idLink(f.winner)+' '+esc(f.winner_short||''):'')+'</td></tr>'; })):'<p class="muted">No method families yet (step 6).</p>'));
  // 5
  var bm=(sm.benchmarks||{}).rows||[], mt=(sm.metrics||{}).rows||[];
  h+=sec(5, '<p class="muted">A dataset is the data and its labels; a benchmark is a task and its rules on a dataset. KPI: a ranking board of this review uses it. Full records: <a href="#datasets">Datasets</a>, <a href="#benchmarks">Benchmarks</a>, <a href="#metrics">Metrics</a>.</p>'
    +'<h4>Main test sets</h4>'+repTable(['Test set','Task','Main metric','Papers','Size','Real or synthetic','Access'], bm.map(function(r){ var f=r.facts||{}; return '<tr><td>'+(idLink(r.id)||'')+' '+esc(r.name)+repKpi(r)+(r.benchmark?' <span class="tg">benchmark</span>':'')+'</td><td>'+esc(r.task||'')+'</td><td>'+esc(r.metric||'')+'</td><td>'+esc(r.papers)+'</td><td>'+esc(f.size||'')+'</td><td>'+esc(f.origin||'')+'</td><td>'+esc(f.access||'')+'</td></tr>'; }))
    +'<h4>Main metrics</h4>'+repTable(['Metric','What it measures','Better','Papers','Limitations'], mt.map(function(r){ return '<tr><td>'+(idLink(r.id)||'')+' '+esc(r.name)+repKpi(r)+'</td><td>'+esc(r.definition||'')+'</td><td>'+esc(r.direction||'')+'</td><td>'+esc(r.papers)+'</td><td>'+esc(r.limitations||'')+'</td></tr>'; }))
    +'<h4>What the published benchmarks leave unmeasured</h4>'+(R&&R.unmeasured?repList(R.unmeasured):repMissing('This list')));
  // 6
  h+=sec(6, '<p class="muted">Each family\'s best paper on the five dimensions: data, representation, architecture, losses and training. Each family\'s slide is in <a href="#explainers">Explainers</a>; every paper\'s notes are in <a href="#details">Method details</a>.</p>'
    +F.map(function(f){ var D2=f.dims||{}; return '<div class="rp-fam"><h4>'+(idLink(f.id)||'')+' '+esc(f.name)+'</h4><p>'+esc(f.headline||f.definition||'')+'</p>'
      +(f.winner?'<p class="muted">Best paper: '+idLink(f.winner)+' '+esc(f.winner_short||'')+'</p>':'')
      +(Object.keys(D2).length?repTable(['Dimension','Best paper'], Object.keys(L.dims||{}).filter(function(k){return D2[k];}).map(function(k){ return '<tr><td>'+esc(L.dims[k])+'</td><td>'+esc(D2[k])+'</td></tr>'; })):'')+'</div>'; }).join(''));
  // 7
  var pv=RVW.provenance||[], wk=RVW.weak_points||{kinds:[],rows:[]};
  h+=sec(7, '<h4>Where the ranked numbers come from</h4><p class="muted">A review reads papers and runs nothing: no number here is reproduced. Boards: <a href="#ranking">Ranking &amp; clusters</a>; every row: <a href="#results">Results</a>.</p>'
    +repTable(['KPI board','Papers','Reported by the paper','Verified on a leaderboard','Reproduced here'], pv.map(function(r){ return '<tr><td>'+esc(r.id)+' '+esc(r.label)+'</td><td>'+r.papers+'</td><td>'+r.reported+'</td><td>'+r.verified+'</td><td>'+r.reproduced+'</td></tr>'; }))
    +'<h4>Weak points of each family\'s best paper</h4><p class="muted">The reviewer\'s reading (inferred), not the authors\' words; each one is on its family\'s slide.</p>'
    +repTable(['Family · best paper'].concat(wk.kinds.map(esc)), wk.rows.map(function(r){ return '<tr><td>'+(idLink(r.id)||'')+' '+esc(r.winner||r.name)+'</td>'+wk.kinds.map(function(k){return '<td>'+(r.kinds[k]||'—')+'</td>';}).join('')+'</tr>'; }))
    +'<h4>What works, under which conditions</h4>'+(R&&R.conditions?repList(R.conditions,function(x){ return x.kind==='unresolved'?'<span class="tg bad">unresolved</span>':'<span class="tg ok">works when</span>'; }):repMissing('This list')));
  // 8
  h+=sec(8, '<p class="muted">From code and weight availability only (<code>enrich</code>); licence, compute and domain fit are not assessed. "Not found" is not "none": nothing was found, which is not a verified absence.</p>'
    +repTable(['Paper','Family','Code','Authors\' weights','Readiness'], (RVW.feasibility||[]).map(function(r){ return '<tr><td>'+idLink(r.id)+' '+esc(r.short)+' <span class="muted">'+esc(r.venue||r.year||'')+'</span></td><td>'+(r.cluster?idLink(r.cluster):'')+'</td><td>'+esc(r.code)+'</td><td>'+esc(r.weights)+'</td><td><b>'+esc(r.readiness)+'</b></td></tr>'; })));
  // 9
  var syn=(META.synthesis||{}).takeaways||[], lim=META.limitations||{};
  h+=sec(9, '<h4>Takeaways</h4><ol class="rp-l">'+syn.map(function(x){ return '<li>'+esc(x.text)+'</li>'; }).join('')+'</ol>'
    +'<h4>Problems several families share</h4><ul class="rp-l">'+(lim.problems||[]).map(function(p){ var n=Object.keys(p.cells||{}).filter(function(k){return (p.cells[k]||{}).state==='affected';}).length; return '<li><b>'+esc(p.id)+'</b> '+esc(p.title)+' <span class="tg">'+esc(p.kind||'')+'</span><span class="muted">'+n+' famil'+(n===1?'y':'ies')+' affected</span></li>'; }).join('')+'</ul><p class="muted">The problem × family matrix is on the synthesis slide in <a href="#explainers">Explainers</a>.</p>'
    +'<h4>Gaps</h4>'+(R&&R.gaps?repList(R.gaps,function(x){ return '<span class="tg ac">'+esc((L.gaps||{})[x.type]||x.type)+'</span>'; }):repMissing('The gap list'))
    +((lim.open_problems||[]).length?'<h4>Open problems</h4><p class="muted">From general knowledge of the field, not from the reviewed papers.</p><ol class="rp-l">'+lim.open_problems.map(function(o){ return '<li><b>'+esc(o.title)+'</b>: '+esc(o.text)+'</li>'; }).join('')+'</ol>':''));
  // 10
  var rm=R&&R.roadmap;
  h+=sec(10, rm?'<div class="rp-prop"><span class="tg bad">proposed experiments, not conducted</span>'
    +(rm.baseline?'<p><b>Baseline first:</b> '+idLink(rm.baseline.paper_id)+' '+esc(shortTitle(PP[rm.baseline.paper_id]))+': '+esc(rm.baseline.reason)+'</p>':'')
    +'<p><b>Shortlist</b></p><ul class="rp-l">'+(rm.shortlist||[]).map(function(x){ return '<li>'+idLink(x.paper_id)+' '+esc(shortTitle(PP[x.paper_id]))+': '+esc(x.reason)+'</li>'; }).join('')+'</ul>'
    +repTable(['Experiment','Question it resolves','Decision it supports','Data and implementation needs','Continue or stop when','Evidence'], (rm.experiments||[]).map(function(x){ return '<tr id="rep-'+esc(x.id)+'"><td><b>'+esc(x.id)+'</b> '+esc(x.experiment)+'</td><td>'+esc(x.question)+'</td><td>'+esc(x.decision)+'</td><td>'+esc(x.needs)+'</td><td>'+esc(x.criteria)+'</td><td>'+repRefs(x.refs)+'</td></tr>'; }))+'</div>':repMissing('The roadmap'));
  h+='<section class="rp-s" id="rep-app"><h3>References and appendices</h3><p class="rp-q">The detailed records behind each section.</p><ul class="rp-l">'
    +[['papers','Full paper matrix (with BibTeX)'],['details','Technical extraction: data, representation, architecture, losses, training'],['datasets','Dataset records'],['benchmarks','Benchmark records'],['metrics','Metric definitions'],['results','Every result row'],['search_terms','Search terms'],['search_runs','Search log'],['decisions','Selection decisions'],['coverage','Coverage check'],['adjacent','Excluded papers by neighbouring topic']]
      .map(function(x){ return '<li><a href="#'+x[0]+'">'+esc(x[1])+'</a></li>'; }).join('')+'</ul></section>';
  main.innerHTML=h;
  Array.prototype.forEach.call(main.querySelectorAll('[data-rep]'),function(a){ a.onclick=function(e){ e.preventDefault(); var el=document.getElementById(a.getAttribute('data-rep')); if(el) el.scrollIntoView(); }; });
}
// ---- presentation (step 8): the chapter plan and the narration script the video is built from ----
function fmtS(s){ s=Math.round(s||0); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function presRefs(rs){ return (rs||[]).map(function(r){ return idLink(r)||esc(r); }).join(', '); }
function presVisual(v){ if(!v) return ''; var rv=(v.reveal||[]).map(function(x){ return 'after sentence '+((typeof x.at==='number')?x.at+1:'?')+': '+esc((x.show||[]).join(', ')); }).join('; ');
  return '<b>'+esc(v.kind||'')+'</b> '+presRefs(v.refs)+(v.message?' <span class="muted">'+esc(v.message)+'</span>':'')+(rv?'<br><span class="muted">'+rv+'</span>':''); }
function presChapter(c, sc){ var ev=c.evidence||{}, eg=c.engagement, dd=c.deep_dive, AU=PRES.audio||{}, AS=AU.start_s||{}, rec=(AU.chapters||{})[c.id];
  var f=function(k,v){ return v?'<dt>'+k+'</dt><dd>'+v+'</dd>':''; };
  var h='<section class="pres-ch" id="pres-'+esc(c.id)+'"><h3>'+esc(c.id)+' '+esc(c.title||'')+' <span class="muted">'+fmtS(c.start_s)+'\u2013'+fmtS(c.end_s)+' ('+(c.end_s-c.start_s)+' s'+(rec?'; recorded '+fmtS(rec.dur)+', '+(rec.drift>0?'+':'')+Math.round(rec.drift*100)+'%':'')+')</span></h3>'
    +'<p><b>'+esc(c.question||'')+'</b></p><p>'+esc(c.takeaway||'')+'</p>'
    +'<details><summary>Chapter card</summary><dl>'+(c.sections?f('Review sections',(c.sections||[]).map(function(n){return esc(n+' '+((RSEC[n]||[])[0]||''));}).join('; ')):f('Functions',esc((c.functions||[]).join(', '))))
    +f('Data scenes',esc((c.summaries||[]).join(', ')))+f('Prior knowledge',esc(c.prior_knowledge))
    +f('Explanation',esc(c.explanation))+f('Supporting evidence',presRefs(ev.supporting))+f('Challenging evidence',presRefs(ev.challenging))
    +f('Comparability',esc(c.comparability))+f('Families',presRefs(c.cluster_ids))+f('Deep dive',dd?idLink(dd.paper_id)+' '+esc(dd.reason):'')
    +f('Visual',presVisual(c.visual))+f('Visual sequence',esc(c.visual_sequence))+f('Example or analogy',esc(c.example))
    +f('Engagement',eg?esc(eg.kind)+': '+esc(eg.prompt||''):'')+f('Transition',esc(c.transition))+'</dl></details>';
  if(!sc){ return h+'<p class="muted">Script not written yet.</p></section>'; }
  h+='<details open><summary>Script: '+sc.scenes.length+(sc.scenes.length===1?' scene, ':' scenes, ')+sc.words+' words, about '+fmtS(sc.est_s)+'</summary><div class="wrap"><table class="pres-scn"><thead><tr><th>Time</th><th>Narration</th><th>Visual</th><th>Sources</th><th>Claim</th></tr></thead><tbody>'
    +sc.scenes.map(function(s){ return '<tr><td>'+fmtS(AS[s.id]!=null?AS[s.id]:s.start_s)+'</td><td class="nar">'+(s.narration||[]).map(esc).join(' ')+(s.on_screen?'<br><span class="muted">On screen: '+esc(s.on_screen)+'</span>':'')+'</td><td>'+presVisual(s.visual)+'</td><td>'+presRefs(s.sources)+'</td><td><span class="pres-claim '+esc(s.claim_type)+'">'+esc(s.claim_type)+'</span>'+(s.engagement?' <span class="badge">'+esc(s.engagement.kind||'')+'</span>':'')+'</td></tr>'; }).join('')
    +'</tbody></table></div></details>';
  return h+'</section>'; }
function presentationPage(main){ var P=PRES.plan, S=PRES.script||{}, ex=P.recurring_example||{}, lex=PRES.lexicon||{};
  var nS=P.chapters.filter(function(c){return S[c.id];}).length;
  var AU=PRES.audio||null;
  var h='<h2>Presentation</h2><p class="muted">The plan and the narration script for a '+esc(P.minutes)+'-minute narrated video of this review (step 8). Scripts written: '+nS+' of '+P.chapters.length+' chapters. '+(AU?'Recorded narration: '+fmtS(AU.total_s)+' for a '+fmtS(AU.target_s)+' plan (voice '+esc(AU.voice)+'); script times are the recorded ones'+((AU.flags||[]).length?'; '+AU.flags.length+' scene(s) flagged by the voice check':'')+'.':'Times in the script are estimates from the spoken word count; the recorded audio sets the final times.')+'</p>';
  h+='<p><b>Audience.</b> '+esc(P.audience||'')+'</p>'+(P.outcome?'<p><b>Outcome.</b> '+esc(P.outcome)+'</p>':'')
    +'<p><b>Organizing axis.</b> '+esc(P.organizing_axis||'')+(P.axis_reason?' <span class="muted">'+esc(P.axis_reason)+'</span>':'')+'</p>'
    +'<p><b>Headline answer.</b></p><ul>'+(P.headline_answer||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'
    +(ex.text?'<p><b>Recurring example'+(ex.illustrative?' (illustrative)':'')+'.</b> '+esc(ex.text)+'</p>':'');
  h+='<div class="wrap"><table><thead><tr><th>Time</th><th>Chapter</th><th>Question</th><th>Visual</th><th>Engagement</th><th>Script</th></tr></thead><tbody>'
    +P.chapters.map(function(c){ var v=c.visual||{}; return '<tr><td>'+fmtS(c.start_s)+'\u2013'+fmtS(c.end_s)+'</td><td><a href="#" data-pres="'+esc(c.id)+'">'+esc(c.id)+' '+esc(c.title||'')+'</a></td><td>'+esc(c.question||'')+'</td><td>'+esc(v.kind||'')+'</td><td>'+esc((c.engagement||{}).kind||'')+'</td><td>'+(S[c.id]?S[c.id].scenes.length+(S[c.id].scenes.length===1?' scene':' scenes'):'<span class="muted">not yet</span>')+'</td></tr>'; }).join('')
    +'</tbody></table></div>';
  h+=P.chapters.map(function(c){ return presChapter(c, S[c.id]); }).join('');
  if((P.folded_clusters||[]).length) h+='<h3>Families without their own chapter</h3><ul>'+P.folded_clusters.map(function(x){return '<li>'+(idLink(x.cluster_id)||esc(x.cluster_id))+' in '+esc(x.into)+': '+esc(x.reason)+'</li>';}).join('')+'</ul>';
  if((P.companion||[]).length) h+='<h3>In the searchable companion</h3><ul>'+P.companion.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if((P.missing_information||[]).length) h+='<h3>Missing information</h3><ul>'+P.missing_information.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  var lk=Object.keys(lex).sort(); if(lk.length) h+='<h3>Pronunciation</h3><div class="wrap"><table><thead><tr><th>Term</th><th>Say</th></tr></thead><tbody>'+lk.map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+esc(lex[k])+'</td></tr>';}).join('')+'</tbody></table></div>';
  main.innerHTML=h;
  Array.prototype.forEach.call(main.querySelectorAll('a[data-pres]'),function(a){ a.onclick=function(e){ e.preventDefault(); var t=document.getElementById('pres-'+a.getAttribute('data-pres')); if(t) t.scrollIntoView(); }; });
}
function render(){
  SLIDE_GO=null;
  var hash=location.hash.replace(/^#/,'')||(META.report&&DATA.report_view?'report':rows('explainers').length?'explainers':(RANK.ranked||[]).length?'ranking':'overview'), parts=hash.split('?'), sec=parts[0], qs=parts[1]||'';
  var m=/q=([^&]*)/.exec(qs); if(m){state.q=decodeURIComponent(m[1]);}
  if(sec==='results'&&/(^|&)raw=1(&|$)/.test(qs)) LB.raw=true;   // '#results?raw=1&q=IRCoT': the all-rows table, filtered
  var navLink=function(s){var n=s[0]==='overview'||s[0]==='report'?'':s[0]==='details'?detailPapers().length:s[0]==='ranking'?(RANK.ranked||[]).length:s[0]==='coverage'?(COV?(COV.neighbours||[]).filter(function(n){return !n.pool||n.pool.status!=='included';}).length:''):s[0]==='adjacent'?(ADJ?adjTopics().length:''):s[0]==='decisions'?(META.decisions||[]).length:s[0]==='presentation'?PRES.plan.chapters.length:rows(s[0]).length; return '<a href="#'+s[0]+'"'+(s[0]===sec?' class="active"':'')+'>'+esc(s[1])+'<span class="cnt">'+n+'</span></a>';};
  var top=NAV_TOP.map(function(k){return SECTIONS.filter(function(s){return s[0]===k;})[0];}), rest=SECTIONS.filter(function(s){return NAV_TOP.indexOf(s[0])<0;});
  var inRest=rest.some(function(s){return s[0]===sec;}), open=NAV_OPEN===null?inRest:(NAV_OPEN||inRest);
  document.getElementById('nav').innerHTML='<h1>'+esc(META.slug||'Review hub')+'</h1>'+top.map(navLink).join('')+'<details class="grp" id="nav-grp"'+(open?' open':'')+'><summary'+(inRest?' class="active"':'')+'>Details</summary>'+rest.map(navLink).join('')+'</details>'+(DATA.pipeline_url?'<a href="'+esc(DATA.pipeline_url)+'" id="pipeline" target="_blank" rel="noopener" title="Steps, processes and code files of the reviewing-literature pipeline">How this review was built</a>':'')+'<a href="#" id="theme">Toggle theme</a>';
  document.getElementById('nav-grp').ontoggle=function(){NAV_OPEN=this.open;};
  var main=document.getElementById('main');
  if(sec==='overview'){ main.innerHTML=overview(); bindBib(); }
  else if(sec==='report'&&DATA.report_view){ reportPage(main); }
  else if(sec==='ranking'){ main.innerHTML=rankingPage(); }
  else if(sec==='explainers'){ slidesPage(main); }
  else if(sec==='details'){ detailsPage(main); }
  else if(sec==='coverage'){ coveragePage(main); }
  else if(sec==='adjacent'){ adjacentPage(main); }
  else if(sec==='decisions'){ main.innerHTML=decisionsPage(); }
  else if(sec==='presentation'&&PRES&&PRES.plan){ presentationPage(main); }
  else if(sec==='results'&&!LB.raw&&!/^R\d{3,}$/.test(state.q.trim())){ leaderboardPage(main); }
  else {
    var recs, cols, title=SECTIONS.filter(function(s){return s[0]===sec;}).map(function(s){return s[1];})[0]||sec;
    if(sec==='results'){ recs=rows('results').map(function(r){var o={}; Object.keys(r).forEach(function(k){o[k]=r[k];}); var rk=RANKS[r.id]; o.rank_in_reviewed_set=rk?rk[0]+'/'+rk[1]:null; return o;}); cols=colsOf(recs); }
    else { recs=rows(sec); cols=colsOf(recs); }
    main.innerHTML='<h2>'+esc(title)+'</h2>'+(sec==='papers'?bibLink():'')+(sec==='results'?'<p><a href="#results" id="lb-back">Back to leaderboards</a></p>'+trimNote():'')+((sec==='papers'||sec==='datasets')&&TRIM&&(TRIM.reasons_cut||TRIM.papers_slimmed)?trimNote():'')+'<div class="tools"><input type="search" id="q" placeholder="filter rows…" value="'+esc(state.q)+'"><button id="clear">clear</button><span class="muted">click a header to sort · tinted cells carry a negative evidence status</span></div>'+table(sec,recs,cols);
    var qi=document.getElementById('q'); qi.oninput=function(){state.q=qi.value; var scroll=window.scrollY; main.querySelector('.wrap').outerHTML=table(sec,recs,cols).split('<p class="muted">')[0]; main.querySelector('p.muted:last-of-type'); bindHeaders(sec,recs,cols); window.scrollTo(0,scroll); qi.focus();};
    document.getElementById('clear').onclick=function(){state.q=''; location.hash='#'+sec; render();};
    bindHeaders(sec,recs,cols); bindBib();
    var bk=document.getElementById('lb-back'); if(bk) bk.onclick=function(e){e.preventDefault(); LB.raw=false; state.q=''; if(location.hash!=='#results') location.hash='#results'; else render();};
  }
  document.getElementById('theme').onclick=function(e){e.preventDefault(); var r=document.documentElement; var cur=r.getAttribute('data-theme'); var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme',dark?'light':'dark'); try{localStorage.setItem('hub-theme',dark?'light':'dark');}catch(x){}};
}
function bindHeaders(sec,recs,cols){ Array.prototype.forEach.call(document.querySelectorAll('th[data-col]'),function(th){ th.onclick=function(){var c=th.getAttribute('data-col'); var s=state.sort[sec]; state.sort[sec]=(s&&s.col===c)?{col:c,dir:-s.dir}:{col:c,dir:1}; render();}; }); }
try{var th=localStorage.getItem('hub-theme'); if(th) document.documentElement.setAttribute('data-theme',th);}catch(x){}
window.addEventListener('hashchange',function(){state.q=''; LB.raw=false; render();});
document.addEventListener('keydown',function(e){ if(!SLIDE_GO) return; var t=e.target&&e.target.tagName; if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA'||e.metaKey||e.ctrlKey||e.altKey) return; if(e.key==='ArrowRight'){e.preventDefault(); SLIDE_GO(1);} else if(e.key==='ArrowLeft'){e.preventDefault(); SLIDE_GO(-1);} });
render();
})();
</script>
